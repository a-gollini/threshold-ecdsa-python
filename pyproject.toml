[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-ecdsa"
version = "1.0.0"
description = "Educational threshold ECDSA on secp256k1 (Shamir/Feldman VSS, Joint-Feldman DKG, threshold signing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "cryptography>=42", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
